services:
  - type: web
    name: taiyaba-portfolio
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: portfolio_analytics
      - key: ANALYTICS_ADMIN_TOKEN
        generateValue: true
      - key: VISITOR_HASH_SECRET
        generateValue: true
